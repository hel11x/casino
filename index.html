<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Velmont Casino</title>
<meta name="description" content="Velmont. A play money casino with live tables, Grand Prix betting and daily rewards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090d;--bg2:#0c0f16;--panel:#121620;--panel2:#181d29;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#ece9e2;--mut:#8a8fa0;--gold:#d9b25f;--gold2:#f6dd94;--gold3:#a3762a;--green:#2ecc8a;--red:#e5484d;--blue:#4c8dff;--felt:#0e5a3c}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(1100px 600px at 85% -10%,rgba(217,178,95,.09),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(46,204,138,.05),transparent 60%),var(--bg)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold3)}
textarea{resize:vertical;min-height:90px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.hidden{display:none!important}
.gold-t{background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--mut)}.green{color:var(--green)}.redt{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:11px;font-weight:600;transition:transform .08s,filter .15s,border-color .15s;background:var(--panel2);border:1px solid var(--line2);white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.22)}
.btn:active{transform:translateY(1px)}
.btn-gold{background:linear-gradient(180deg,var(--gold2),var(--gold) 45%,var(--gold3));color:#1b1406;border:0;box-shadow:0 8px 24px rgba(217,178,95,.22),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-gold:hover{filter:brightness(1.08)}
.btn-green{background:linear-gradient(180deg,#43e3a2,#1a9e66);color:#03140c;border:0;box-shadow:0 8px 22px rgba(46,204,138,.2)}
.btn-red{background:linear-gradient(180deg,#f06a71,#b52d34);color:#fff;border:0}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-lg{padding:15px 24px;font-size:15px}
.btn-block{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* layout */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#0b0e15,#07090d);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:14px;z-index:50}
.side::-webkit-scrollbar{width:0}
.logo{display:flex;align-items:center;gap:11px;padding:0 8px 8px;cursor:pointer}
.logo .word{font-family:'Playfair Display',serif;font-size:23px;letter-spacing:.14em;font-weight:700;line-height:1}
.logo small{display:block;font-size:8.5px;letter-spacing:.42em;color:var(--mut);margin-top:5px}
.nav-label{font-size:10px;letter-spacing:.22em;color:#5d6272;text-transform:uppercase;padding:10px 12px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#aeb3c2;cursor:pointer;font-weight:500;transition:background .12s,color .12s;text-decoration:none;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.035);color:#fff}
.nav a.on{background:linear-gradient(90deg,rgba(217,178,95,.15),rgba(217,178,95,.01));color:var(--gold2);box-shadow:inset 2px 0 0 var(--gold)}
.nav a svg{width:18px;height:18px;flex:none}
.nav a .pill{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:99px;background:rgba(46,204,138,.12);color:var(--green);font-weight:700}
.lvl-card{margin-top:auto;padding:14px;border-radius:14px;background:linear-gradient(160deg,rgba(217,178,95,.12),rgba(217,178,95,.02));border:1px solid rgba(217,178,95,.18)}
.lvl-card .top-l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:9px;transition:width .4s}
.bar.green i{background:linear-gradient(90deg,#1a9e66,#43e3a2)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:13px 28px;background:rgba(7,9,13,.84);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.icon-btn.burger{display:none}
.top .grow{flex:1}
.bal{display:flex;align-items:center;gap:12px;padding:5px 5px 5px 16px;border-radius:13px;background:var(--panel);border:1px solid var(--line)}
.bal .lbl{font-size:9.5px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase;display:block}
.bal b{font-size:16px;font-variant-numeric:tabular-nums;transition:color .3s}
.bal b.up{color:var(--green)}.bal b.down{color:var(--red)}
.chipbtn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:12.5px;font-variant-numeric:tabular-nums}
.chipbtn svg{width:16px;height:16px}
.chipbtn.ready{border-color:rgba(46,204,138,.45);color:var(--green);box-shadow:0 0 0 3px rgba(46,204,138,.07)}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.icon-btn svg{width:19px;height:19px}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);font-size:10px;font-weight:700;display:grid;place-items:center;color:#fff}
.me-btn{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.me-btn .nm{font-weight:600;font-size:13px;line-height:1.1;text-align:left}
.me-btn .nm small{display:block;color:var(--gold);font-size:10.5px;font-weight:500}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.2),transparent 60%),var(--avc,#2a2f3d);flex:none;line-height:1}
.av.sm{width:30px;height:30px;font-size:15px}
.av.lg{width:104px;height:104px;font-size:52px}
.av.f-gold{box-shadow:0 0 0 2px #0b0d12,0 0 0 4px #d9b25f,0 0 18px rgba(217,178,95,.45)}
.av.f-emerald{box-shadow:0 0 0 2px #0b0d12,0 0 0 4px #2ecc8a,0 0 18px rgba(46,204,138,.45)}
.av.f-neon{box-shadow:0 0 0 2px #0b0d12,0 0 0 4px #ff3ea5,0 0 20px rgba(255,62,165,.55),0 0 34px rgba(76,141,255,.35)}
.av.f-diamond{box-shadow:0 0 0 2px #0b0d12,0 0 0 4px #c8efff,0 0 26px rgba(200,239,255,.7)}
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:#090b11;white-space:nowrap;position:relative}
.ticker::before,.ticker::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2}
.ticker::before{left:0;background:linear-gradient(90deg,#090b11,transparent)}
.ticker::after{right:0;background:linear-gradient(-90deg,#090b11,transparent)}
.ticker-in{display:inline-flex;gap:34px;padding:9px 0;animation:tick 60s linear infinite;font-size:12px}
.ticker-in span{color:var(--mut)}.ticker-in b{color:var(--text);font-weight:600}.ticker-in em{font-style:normal;color:var(--green);font-weight:700}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#view{padding:28px;max-width:1440px;width:100%;margin:0 auto;flex:1;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.foot{padding:28px;border-top:1px solid var(--line);color:#5d6272;font-size:12px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot b{color:var(--mut)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.page-head p{color:var(--mut);margin-top:6px}
.eyebrow{display:inline-block;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.card{background:linear-gradient(180deg,var(--panel),#0e121a);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.35);min-width:0}
.card h3{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:14px}
.sec{font-family:'Playfair Display',serif;font-size:22px;margin:30px 0 16px}
.live-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(46,204,138,.08);border:1px solid rgba(46,204,138,.25);color:var(--green);font-weight:600;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,138,.6)}70%{box-shadow:0 0 0 8px rgba(46,204,138,0)}100%{box-shadow:0 0 0 0 rgba(46,204,138,0)}}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:rgba(255,255,255,.06);color:#c4c8d4}
.tag.gold{background:rgba(217,178,95,.14);color:var(--gold2)}
.tag.green{background:rgba(46,204,138,.12);color:var(--green)}
.tag.red{background:rgba(229,72,77,.13);color:#ff8a8e}
.field label,.betbox label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:7px;font-weight:600}
.field input,.field select,.field textarea{width:100%}
.betrow{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px}
.betrow:focus-within{border-color:var(--gold3)}
.betrow input{flex:1;border:0;background:none;padding:9px 6px;min-width:0;font-weight:700;font-size:15px}
.betrow .cur{padding-left:10px;color:var(--gold);font-weight:700}
.betrow button{padding:8px 11px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:12px;margin-left:4px;border:1px solid var(--line)}
.betrow button:hover{border-color:var(--line2)}
.kv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.empty{color:var(--mut);padding:20px 0;text-align:center}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:12px;border-bottom:1px solid var(--line);font-size:13px}
.tbl tr:hover td{background:rgba(255,255,255,.015)}
.tbl-wrap{overflow-x:auto}
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:8px 15px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

/* toasts & modal */
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;background:rgba(20,24,34,.96);border:1px solid var(--line2);box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(10px);animation:tin .3s ease;font-size:13px;line-height:1.45}
.toast .ti{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
.toast.win .ti{background:var(--green);box-shadow:0 0 12px var(--green)}
.toast.lose .ti,.toast.err .ti{background:var(--red)}
.toast.gold .ti{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.toast.out{opacity:0;transform:translateX(20px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#modal{position:fixed;inset:0;z-index:150;background:rgba(3,4,7,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:440px;animation:tin .25s ease}
.modal h2{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:8px}

/* auth */
#auth{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.auth-art{position:relative;overflow:hidden;padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(800px 500px at 30% 20%,rgba(217,178,95,.18),transparent 60%),radial-gradient(700px 500px at 80% 90%,rgba(14,90,60,.45),transparent 60%),#06080c;border-right:1px solid var(--line)}
.auth-art h1{font-family:'Playfair Display',serif;font-size:56px;line-height:1.04;max-width:560px;letter-spacing:-.015em}
.auth-art p{color:#a5aaba;max-width:440px;margin-top:18px;font-size:15px;line-height:1.6}
.auth-feats{display:flex;gap:28px;flex-wrap:wrap}
.auth-feats div b{display:block;font-size:24px;font-family:'Playfair Display',serif}
.auth-feats div span{font-size:12px;color:var(--mut)}
.float-cards{position:absolute;right:-30px;top:22%;width:340px;height:300px;pointer-events:none;opacity:.9}
.float-cards .pc{position:absolute;width:120px;height:170px;font-size:22px}
.auth-side{display:grid;place-items:center;padding:40px 24px}
.auth-card{width:100%;max-width:400px}
.auth-card h2{font-family:'Playfair Display',serif;font-size:30px;margin-bottom:6px}

/* hero / lobby */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:44px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;background:radial-gradient(600px 300px at 90% 10%,rgba(217,178,95,.22),transparent 60%),radial-gradient(500px 300px at 70% 120%,rgba(14,90,60,.55),transparent 60%),linear-gradient(135deg,#141824,#0b0e15);border:1px solid rgba(217,178,95,.18);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.hero h1{font-family:'Playfair Display',serif;font-size:44px;line-height:1.08;letter-spacing:-.01em}
.hero p{color:#a9aebd;margin:14px 0 24px;max-width:470px;font-size:15px;line-height:1.6}
.hero-art{position:relative;height:230px}
.hero-art .pc{position:absolute;width:118px;height:166px;font-size:22px}
.hchip{position:absolute;width:86px;height:86px;border-radius:50%;background:radial-gradient(circle,#fff0 46%,rgba(255,255,255,.9) 47%,rgba(255,255,255,.9) 53%,#fff0 54%),repeating-conic-gradient(var(--cc) 0 15deg,#f4f1ea 15deg 30deg);box-shadow:0 14px 30px rgba(0,0,0,.5),inset 0 0 0 7px var(--cc);display:grid;place-items:center}
.hchip::after{content:"";width:46px;height:46px;border-radius:50%;background:var(--cc);box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}
.stat{padding:18px 20px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.stat b{display:block;font-size:24px;margin-top:6px;font-variant-numeric:tabular-nums}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gcard{position:relative;overflow:hidden;border-radius:18px;height:200px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border:1px solid var(--line);transition:transform .2s,box-shadow .2s,border-color .2s;background:var(--gbg)}
.gcard:hover{transform:translateY(-4px);box-shadow:0 24px 50px rgba(0,0,0,.5);border-color:rgba(217,178,95,.35)}
.gcard .gico{position:absolute;right:-18px;top:-14px;width:150px;height:150px;color:rgba(255,255,255,.14);transition:transform .4s}
.gcard:hover .gico{transform:rotate(-8deg) scale(1.06)}
.gcard .gico svg{width:100%;height:100%;stroke-width:1.1}
.gcard h4{font-family:'Playfair Display',serif;font-size:22px;position:relative}
.gcard small{color:rgba(255,255,255,.7);position:relative;font-size:12px}
.gcard .gl{position:absolute;top:16px;left:16px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);padding:5px 10px;border-radius:99px;backdrop-filter:blur(6px)}
.feed{display:flex;flex-direction:column;gap:4px;max-height:380px;overflow:hidden}
.fi{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;animation:tin .3s ease}
.fi:nth-child(odd){background:rgba(255,255,255,.02)}
.fi>div{flex:1;min-width:0}
.fi>div.av{flex:0 0 auto}
.fi b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi small{color:var(--mut);font-size:11.5px}
.fi .amt{font-weight:700;font-variant-numeric:tabular-nums}
.fi .w{font-size:10px;font-weight:800;color:var(--green);background:rgba(46,204,138,.12);padding:3px 7px;border-radius:6px;margin-left:6px}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:0}
.lb-row .rk{width:26px;text-align:center;font-weight:800;color:var(--mut)}
.lb-row.r1 .rk{color:#f6dd94}.lb-row.r2 .rk{color:#cfd6e2}.lb-row.r3 .rk{color:#d79a63}
.lb-row.me{background:rgba(217,178,95,.07);border-radius:10px}
.lb-row .nm{flex:1;font-weight:600}

/* playing cards */
.pc{width:76px;height:108px;border-radius:9px;background:linear-gradient(160deg,#fff,#ece9e2);color:#15171c;position:relative;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.08);flex:none;font-weight:700;font-size:15px;animation:deal .35s cubic-bezier(.2,.8,.2,1) both}
.pc.red{color:#c8202a}
.pc .r1{position:absolute;top:6px;left:8px;line-height:1;text-align:center}
.pc .r1 i{display:block;font-style:normal;font-size:.85em}
.pc .r2{position:absolute;bottom:6px;right:8px;line-height:1;transform:rotate(180deg);text-align:center}
.pc .r2 i{display:block;font-style:normal;font-size:.85em}
.pc .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:2.2em}
.pc.back{background:repeating-linear-gradient(45deg,#7a1d27 0 6px,#5e141d 6px 12px);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 0 0 4px #f2ede3,inset 0 0 0 6px #7a1d27}
.pc.back::after{content:"V";position:absolute;inset:0;display:grid;place-items:center;font-family:'Playfair Display',serif;color:var(--gold2);font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.pc.back>*{display:none}
@keyframes deal{from{opacity:0;transform:translateY(-30px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}

/* roulette */
.rl-layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}
.wheel-wrap{position:relative;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto}
.wheel-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 8px #241a0b,0 0 0 10px rgba(217,178,95,.55),0 30px 70px rgba(0,0,0,.6)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--gold2);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:3}
.wheel-hub{position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3b2c14,#120d05);box-shadow:0 0 0 3px var(--gold3),inset 0 4px 14px rgba(0,0,0,.6);font-family:'Playfair Display',serif;font-size:30px;font-weight:700;z-index:2}
.wheel-hub .red{color:#ff5a62}.wheel-hub .black{color:#fff}.wheel-hub .green{color:#3be59b}
.hub-logo{color:var(--gold2)}
.rl-status{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding:14px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.rl-status b{font-size:18px;font-variant-numeric:tabular-nums}
.rl-status b.hot{color:var(--red)}
.rl-status .num{padding:2px 12px;border-radius:8px}
.num.red,.hn.red{background:#b3202a}.num.black,.hn.black{background:#20232b}.num.green,.hn.green{background:#0f8a52}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700}
.hn:first-child{box-shadow:0 0 0 2px var(--gold)}
.board-scroll{overflow-x:auto;padding-bottom:6px}
.rl-board{display:grid;grid-template-columns:40px repeat(12,minmax(34px,1fr)) 44px;grid-template-rows:repeat(3,50px) 42px 42px;gap:4px;min-width:600px;padding:12px;border-radius:16px;background:radial-gradient(ellipse at center,#127048,#0a4a30);box-shadow:inset 0 0 0 2px rgba(217,178,95,.35),inset 0 8px 40px rgba(0,0,0,.4)}
.rc{position:relative;display:grid;place-items:center;border-radius:7px;font-weight:700;cursor:pointer;user-select:none;border:1px solid rgba(255,255,255,.15);transition:filter .12s,transform .08s;font-size:14px}
.rc:hover{filter:brightness(1.25)}
.rc:active{transform:scale(.97)}
.rc.red{background:linear-gradient(180deg,#c42631,#9a1a23)}
.rc.black{background:linear-gradient(180deg,#262a33,#15171d)}
.rc.zero{grid-row:1/4;grid-column:1;background:linear-gradient(180deg,#13a463,#0b6f42)}
.rc.out{background:rgba(0,0,0,.18);font-size:12.5px;letter-spacing:.04em}
.rc.out.red{background:linear-gradient(180deg,#c42631,#9a1a23)}.rc.out.black{background:linear-gradient(180deg,#262a33,#15171d)}
.rc.hit{box-shadow:0 0 0 2px var(--gold2),0 0 18px rgba(246,221,148,.6);z-index:2}
.cb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);min-width:30px;height:30px;padding:0 4px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#1b1406;background:radial-gradient(circle,var(--gold2) 50%,var(--gold3) 52%,var(--gold) 70%);box-shadow:0 3px 8px rgba(0,0,0,.6),0 0 0 2px #fff4;z-index:3;animation:pop .2s ease}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:radial-gradient(circle,var(--cc) 48%,#fff 50%,#fff 56%,var(--cc) 58%);box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 0 0 4px rgba(255,255,255,.25);transition:transform .12s;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.chip:hover{transform:translateY(-3px)}
.chip.on{box-shadow:0 0 0 3px var(--gold2),0 10px 20px rgba(0,0,0,.5);transform:translateY(-4px)}
.timer-bar{height:4px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.timer-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));transition:width 1s linear}

/* blackjack */
.bj-wrap{overflow-x:auto;padding-bottom:6px}
.bj-table{position:relative;min-width:860px;height:560px;border-radius:50% 50% 30px 30px/70% 70% 30px 30px;background:radial-gradient(ellipse at 50% 30%,#13764b,#0a4a2f 60%,#073823);box-shadow:inset 0 0 0 10px #3b2810,inset 0 0 0 13px var(--gold3),inset 0 0 0 15px #2a1c09,inset 0 30px 80px rgba(0,0,0,.45),0 40px 80px rgba(0,0,0,.5);overflow:hidden}
.bj-arc{position:absolute;left:50%;top:478px;width:100%;transform:translateX(-50%);text-align:center;color:rgba(246,221,148,.55);font-family:'Playfair Display',serif;letter-spacing:.18em;font-size:13px;pointer-events:none}
.bj-arc b{display:block;font-size:22px;color:rgba(246,221,148,.75);letter-spacing:.1em}
.bj-dealer{position:absolute;top:34px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
.bj-dealer .dl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.hand{display:flex;min-height:108px}
.hand .pc+.pc{margin-left:-38px}
.hv{display:inline-block;padding:3px 11px;border-radius:99px;background:rgba(0,0,0,.55);font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.15)}
.seat{position:absolute;width:150px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;transition:filter .2s}
.seat .hand{min-height:96px}
.seat .pc{width:64px;height:92px;font-size:13px}
.seat .hand .pc+.pc{margin-left:-36px}
.seat .who{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;border-radius:99px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1);font-size:12px;font-weight:600;max-width:150px}
.seat .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat.turn .who{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(246,221,148,.25),0 0 22px rgba(246,221,148,.35)}
.seat.mine .who{background:rgba(217,178,95,.2)}
.seat .betc{font-size:11px;font-weight:700;color:var(--gold2)}
.seat .res{position:absolute;top:30px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.75);z-index:5;letter-spacing:.05em}
.res.Win,.res.Blackjack{color:var(--green)}.res.Bust,.res.Lose,.res\.Dealer{color:#ff7a80}.res.Push{color:#ddd}
.seat.empty .open{width:76px;height:76px;border-radius:50%;border:2px dashed rgba(255,255,255,.18);display:grid;place-items:center;font-size:11px;color:rgba(255,255,255,.4);margin-top:40px}
.bj-controls{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-top:18px}
.bj-msg{font-size:15px;font-weight:600;min-height:22px}

/* slots */
.cab{--h:118px;position:relative;max-width:920px;margin:0 auto;padding:20px 20px 24px;border-radius:34px 34px 24px 24px;background:linear-gradient(180deg,#2e2010,#140d05 38%,#0c0805);box-shadow:inset 0 0 0 2px #6b4f1a,inset 0 0 0 7px #120c04,inset 0 0 0 9px rgba(217,178,95,.5),0 60px 120px rgba(0,0,0,.65),0 0 140px rgba(217,178,95,.08)}
.marquee{position:relative;text-align:center;padding:30px 20px 26px;border-radius:24px;background:radial-gradient(ellipse at 50% -20%,#7a3fc0,#2a0f4d 55%,#12061f);box-shadow:inset 0 0 0 2px rgba(246,221,148,.65),inset 0 0 50px rgba(0,0,0,.55);overflow:hidden}
.marquee::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 130%,rgba(255,255,255,.05) 0 5deg,transparent 5deg 10deg);pointer-events:none}
.bulbs{position:absolute;left:18px;right:18px;display:flex;justify-content:space-between}
.bulbs.top{top:10px}.bulbs.bot{bottom:10px}
.bulbs i{width:7px;height:7px;border-radius:50%;background:#ffe7a3;box-shadow:0 0 8px #ffd76a,0 0 2px #fff;animation:chase 1s steps(1) infinite}
.bulbs i:nth-child(2n){animation-delay:.5s}
@keyframes chase{50%{background:#5a4420;box-shadow:none}}
.mq-sub{position:relative;font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:rgba(246,221,148,.75)}
.marquee h2{position:relative;font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(26px,5vw,50px);letter-spacing:.12em;margin:6px 0 12px;background:linear-gradient(180deg,#fffbe8,#f6dd94 40%,#c9962f 62%,#fff1bd);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5a3d0c) drop-shadow(0 0 18px rgba(246,221,148,.35))}
.jackpot{position:relative;display:inline-flex;gap:14px;align-items:center;padding:9px 20px;border-radius:12px;background:#060408;box-shadow:inset 0 0 0 1px rgba(246,221,148,.45),0 0 24px rgba(0,0,0,.6)}
.jackpot span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.jackpot b{font-size:24px;font-variant-numeric:tabular-nums;color:#ffd76a;text-shadow:0 0 14px rgba(255,215,106,.65);letter-spacing:.04em}
.reels-frame{position:relative;display:flex;gap:8px;align-items:stretch;margin-top:18px;padding:14px 10px;border-radius:20px;background:linear-gradient(180deg,#3d2c11,#1b1307);box-shadow:inset 0 0 0 2px rgba(217,178,95,.6),inset 0 10px 24px rgba(0,0,0,.7)}
.ltags{display:flex;flex-direction:column;justify-content:space-around;gap:4px}
.ltags span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#160f03;background:var(--lc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.3),0 0 0 2px #1b1307;cursor:default}
.reels{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;height:calc(var(--h)*3);border-radius:12px;background:#050403}
.reel{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(180deg,#cfc7b4,#f6f1e6 16%,#fffdf8 50%,#f6f1e6 84%,#cfc7b4)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 18px 22px -12px rgba(0,0,0,.55),inset 0 -18px 22px -12px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.25)}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.sym{height:var(--h);display:grid;place-items:center;padding:12%}
.sym svg{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));overflow:visible}
.reel.spin .strip{filter:blur(2.5px)}
.reel.stop{animation:rstop .32s ease}
@keyframes rstop{35%{transform:translateY(5px)}}
.sym.hit svg{animation:hit .7s ease-in-out infinite alternate}
@keyframes hit{to{transform:scale(1.1);filter:drop-shadow(0 0 10px rgba(255,200,80,.95))}}
.wlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.wlines polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px currentColor);animation:dash .9s ease}
@keyframes dash{from{stroke-dasharray:1400;stroke-dashoffset:1400}to{stroke-dasharray:1400;stroke-dashoffset:0}}
.bigwin{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle,rgba(30,10,45,.82),rgba(0,0,0,.45));border-radius:12px;animation:tin .3s ease}
.bigwin span{font-family:'Playfair Display',serif;font-weight:800;font-size:clamp(30px,6vw,64px);letter-spacing:.1em;background:linear-gradient(180deg,#fffbe8,#f6dd94,#c9962f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(246,221,148,.6));animation:pulseT .6s ease infinite alternate}
.bigwin b{font-size:clamp(22px,4vw,38px);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,215,106,.8)}
@keyframes pulseT{to{transform:scale(1.06)}}
.cab-panel{display:grid;grid-template-columns:minmax(0,1.3fr) auto minmax(0,1fr);gap:18px;align-items:center;margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(180deg,#120d07,#080604);box-shadow:inset 0 0 0 1px rgba(217,178,95,.3)}
.lcds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lcd{padding:10px 12px;border-radius:10px;background:#030202;box-shadow:inset 0 0 0 1px rgba(246,221,148,.18),inset 0 4px 10px rgba(0,0,0,.8);min-width:0}
.lcd span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a7a55}
.lcd b{display:block;font-size:16px;color:#ffd76a;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,215,106,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcd.win b{color:#5dffb0;text-shadow:0 0 10px rgba(93,255,176,.5)}
.spin-btn{width:104px;height:104px;border-radius:50%;font-weight:900;font-size:17px;letter-spacing:.12em;color:#2b1d06;background:radial-gradient(circle at 35% 28%,#fff6d3,#f0c860 38%,#b8862b 70%,#7a561a);box-shadow:0 0 0 5px #1a1206,0 0 0 7px rgba(246,221,148,.65),0 14px 30px rgba(0,0,0,.7),0 0 46px rgba(217,178,95,.4),inset 0 -6px 12px rgba(0,0,0,.25);transition:transform .1s,filter .15s}
.spin-btn:hover{filter:brightness(1.08)}.spin-btn:active{transform:scale(.96)}
.spin-btn:disabled{filter:grayscale(.5) brightness(.75);cursor:not-allowed}
.cab-ctl{display:flex;flex-direction:column;gap:10px}
.lbsel{display:flex;align-items:center;gap:8px;padding:6px;border-radius:12px;background:#030202;box-shadow:inset 0 0 0 1px rgba(246,221,148,.18)}
.lbsel button{width:36px;height:36px;border-radius:9px;background:linear-gradient(180deg,#3a2a10,#1c1408);color:var(--gold2);font-size:18px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(217,178,95,.4)}
.lbsel div{flex:1;text-align:center}.lbsel span{display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#8a7a55}.lbsel b{color:#ffd76a;font-size:15px}
.paygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.paycard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--panel),#0e121a);border:1px solid var(--line)}
.paycard .pi{width:64px;height:64px;flex:none;border-radius:12px;padding:8px;background:linear-gradient(180deg,#fbf7ee,#d6cdb8);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.paycard .pi svg{width:100%;height:100%}
.paycard>div:last-child{flex:1}
.paycard .pr{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:3px}
.paycard .pr b{color:var(--text)}
@media(max-width:760px){.cab{--h:58px;padding:12px;border-radius:24px}.cab-panel{grid-template-columns:1fr;justify-items:center}.lcds,.cab-ctl{width:100%}.ltags span{width:18px;height:18px;font-size:9px}.reels{gap:4px}.reels-frame{padding:10px 6px;gap:4px}.marquee{padding:26px 12px 22px}.jackpot b{font-size:18px}}

/* mines */
.mines-layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px}
.mn-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:560px;margin:0 auto}
.mt{aspect-ratio:1;border-radius:14px;background:linear-gradient(180deg,#232a3a,#181d29);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35);transition:transform .12s,filter .12s;display:grid;place-items:center;font-size:clamp(22px,4vw,36px)}
.mt:not(:disabled):hover{transform:translateY(-3px);filter:brightness(1.2)}
.mt:disabled{cursor:default}
.mt.gem{background:radial-gradient(circle,rgba(46,204,138,.28),rgba(46,204,138,.06));box-shadow:inset 0 0 0 2px rgba(46,204,138,.5);animation:flip .3s ease}
.mt.bomb{background:radial-gradient(circle,rgba(229,72,77,.4),rgba(229,72,77,.08));box-shadow:inset 0 0 0 2px rgba(229,72,77,.6);animation:flip .3s ease}
.mt.dim{opacity:.45}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.big-mult{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}

/* hilo */
.hl-stage{display:flex;flex-direction:column;align-items:center;gap:22px;padding:20px 0}
.hl-stage .pc{width:150px;height:212px;font-size:28px;border-radius:14px}
.hl-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:560px}
.hl-btns .btn{flex-direction:column;gap:2px;padding:14px}
.hl-btns .btn small{font-size:11px;opacity:.8;font-weight:600}
.trail{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:62px}
.trail .pc{width:44px;height:62px;font-size:11px;border-radius:6px}

/* races */
.rc-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.circuit{position:relative;border-radius:16px;background:radial-gradient(ellipse at center,#16301f,#0b1a11);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.circuit svg{width:100%;display:block}
.lights{position:absolute;left:50%;top:14px;transform:translateX(-50%);display:flex;gap:8px;padding:8px 12px;border-radius:12px;background:#0a0a0a;border:1px solid #222}
.lights i{width:18px;height:18px;border-radius:50%;background:#2a0b0b}
.lights i.on{background:#ff2b2b;box-shadow:0 0 14px #ff2b2b}
.lights.go i{background:#22e07a;box-shadow:0 0 14px #22e07a}
.rc-banner{position:absolute;left:14px;bottom:12px;padding:6px 12px;border-radius:9px;background:rgba(0,0,0,.65);font-weight:700;font-size:13px;letter-spacing:.05em}
.tower{font-variant-numeric:tabular-nums}
.tw-row{display:grid;grid-template-columns:28px 5px minmax(0,1fr) 78px;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px;transition:background .2s}
.tw-row .ps{font-weight:800;text-align:center}
.tw-row .cl{height:20px;border-radius:2px}
.tw-row .gp{text-align:right;color:var(--mut);font-size:12px}
.tw-row.p1 .gp{color:var(--gold2)}
.tw-row.mine{background:rgba(217,178,95,.07)}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.team{border-radius:16px;padding:16px;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 22%,#121620),#0f131b 70%);border:1px solid var(--line);position:relative;overflow:hidden}
.team::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.team .car{width:100%;height:58px;margin:4px 0 8px}
.team h4{font-size:15px}
.team small{color:var(--mut)}
.team .rt{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin:8px 0 12px}
.team .rt .bar{flex:1}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.odds button{padding:9px;border-radius:10px;background:rgba(0,0,0,.3);border:1px solid var(--line2);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center}
.odds button small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600}
.odds button:hover:not(:disabled){border-color:var(--gold);background:rgba(217,178,95,.08)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:10px 0}
.podium div{text-align:center;padding:12px;border-radius:12px 12px 0 0;min-width:90px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.podium .p1{height:130px;background:linear-gradient(180deg,rgba(217,178,95,.25),rgba(217,178,95,.05))}
.podium .p2{height:100px}.podium .p3{height:80px}

/* wheel */
.wh-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.wh-wrap{position:relative;width:100%;max-width:470px;aspect-ratio:1;margin:10px auto}
.wh-wrap canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 10px #1b150a,0 0 0 13px var(--gold3),0 0 0 15px #1b150a,0 40px 90px rgba(0,0,0,.6),0 0 80px rgba(217,178,95,.15)}
.wh-hub{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold3));box-shadow:0 6px 20px rgba(0,0,0,.6),inset 0 2px 4px rgba(255,255,255,.5);display:grid;place-items:center;font-family:'Playfair Display',serif;font-weight:800;font-size:30px;color:#2b1f08;z-index:2}
.big-timer{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{border-radius:18px;padding:20px;background:linear-gradient(180deg,var(--panel),#0e121a);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.item:hover{border-color:rgba(217,178,95,.3);transform:translateY(-2px)}

.code-hero{text-align:center;padding:40px 22px;border-radius:22px;background:radial-gradient(500px 200px at 50% 0%,rgba(217,178,95,.18),transparent 70%),var(--panel);border:1px solid rgba(217,178,95,.2)}
.code-in{display:flex;gap:10px;max-width:480px;margin:22px auto 0}

.msg-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
.chat{height:460px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.cm{display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease}
.cm .bub{padding:9px 13px;border-radius:4px 14px 14px 14px;background:var(--panel2);border:1px solid var(--line);max-width:80%;font-size:13.5px;line-height:1.45;word-wrap:break-word}
.cm .bub b{display:block;font-size:12px;margin-bottom:2px;color:var(--gold2)}
.cm .bub small{color:#5d6272;font-size:10.5px;margin-left:6px;font-weight:500}
.cm.self{flex-direction:row-reverse}

.pick-grid button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,178,95,.3)}
.sw{width:34px!important;height:34px!important;border-radius:50%!important}
.prof-card{text-align:center;padding:34px 22px;background:radial-gradient(400px 200px at 50% 0%,rgba(217,178,95,.16),transparent 70%),linear-gradient(180deg,var(--panel),#0e121a)}

 for(let i=0;i<37;i++){const n=RW[i],a0=-Math.PI/2+i*seg-seg/2;x.beginPath();x.moveTo(R,R);x.arc(R,R,R*.94,a0,a0+seg);x.closePath();x.fillStyle=n===0?'#0f8a52':REDS.has(n)?'#b3202a':'#16181f';x.fill();x.strokeStyle='rgba(246,221,148,.55)';x.lineWidth=1.4;x.stroke();x.save();x.translate(R,R);x.rotate(i*seg);x.fillStyle='#fff';x.font=`700 ${Math.round(W*.034)}px Inter,sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(n,0,-R*.84);x.restore()}
 x.beginPath();x.arc(R,R,R*.74,0,7);g=x.createRadialGradient(R,R,0,R,R,R*.74);g.addColorStop(0,'#2b1f0c');g.addColorStop(1,'#120d05');x.fillStyle=g;x.fill();x.lineWidth=3;x.strokeStyle='#a3762a';x.stroke();
 for(let i=0;i<8;i++){x.save();x.translate(R,R);x.rotate(i*Math.PI/4);x.fillStyle='rgba(217,178,95,.35)';x.fillRect(-2,-R*.72,4,R*.3);x.restore()}}

function newShoe(){const s=[];for(let d=0;d<6;d++)for(const su of SUITS)for(const r of RANKS)s.push({r,s:su});for(let i=s.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s[i],s[j]]=[s[j],s[i]]}return s}
const cvl=c=>c.r==='A'?11:['J','Q','K'].includes(c.r)?10:+c.r;
function hv(cards){let t=0,a=0;for(const c of cards){if(c.hidden)continue;t+=cvl(c);if(c.r==='A')a++}while(t>21&&a){t-=10;a--}return{t,soft:a>0}}
const BJ={phase:'bet',shoe:newShoe(),dealer:[],seats:null,turn:-1,msg:'Place your bet to join the next hand.',resolver:null};
function bjDraw(){if(BJ.shoe.length<52){BJ.shoe=newShoe();toast('The dealer shuffles a fresh six deck shoe')}return BJ.shoe.pop()}
function bjTake(pred){const i=BJ.shoe.findIndex(pred);return i<0?null:BJ.shoe.splice(i,1)[0]}
function bjDrawFor(cards,who){if(ME&&U().luck){const{t,soft}=hv(cards);
  if(who==='me'&&!soft&&t>=10&&t<=16){if(Math.random()<(t>=12?.72:.35)){const c=bjTake(c=>cvl(c)===21-t);if(c)return c}if(t>=12&&Math.random()<.6){const c=bjTake(c=>c.r!=='A'&&cvl(c)<=21-t);if(c)return c}}
  if(who==='dealer'&&!soft&&t>=12&&t<=16&&Math.random()<.45){const c=bjTake(c=>c.r!=='A'&&cvl(c)>21-t);if(c)return c}}
 return bjDraw()}
function bjSeat(){return{name:pick(BOTS),bet:0,cards:[],result:''}}
function bjInitSeats(){if(BJ.seats)return;BJ.seats=[0,1,2,3,4].map(i=>i===2?{isMe:true,bet:0,cards:[],result:''}:Math.random()<.7?bjSeat():null)}
function bjRotate(){BJ.seats.forEach((s,i)=>{if(i===2)return;if(Math.random()<.22)BJ.seats[i]=Math.random()<.7?bjSeat():null});const used=BJ.seats.filter(s=>s&&!s.isMe).map(s=>s.name);BJ.seats.forEach(s=>{if(s&&!s.isMe&&used.filter(n=>n===s.name).length>1)s.name=pick(BOTS.filter(n=>!used.includes(n)))})}
async function bjDeal(){if(BJ.phase!=='bet')return;const amt=Math.floor(+$('#bjBet').value);if(!takeBet(amt,'blackjack'))return;
 BJ.phase='play';bjRotate();const me=BJ.seats[2];Object.assign(me,{bet:amt,cards:[],result:'',ret:0});
 BJ.seats.forEach(s=>{if(s&&!s.isMe)Object.assign(s,{bet:pick([500,1000,2000,2500,5000,10000]),cards:[],result:''})});
 BJ.dealer=[];BJ.msg='Dealing';bjRender();const act=BJ.seats.filter(Boolean);
 for(let r=0;r<2;r++){for(const s of act){s.cards.push(bjDraw());bjRender();await sleep(240)}const dc=bjDraw();if(r===1)dc.hidden=true;BJ.dealer.push(dc);bjRender();await sleep(240)}
 const up=BJ.dealer[0];if(up.r==='A'||cvl(up)===10){BJ.msg='Dealer checks for blackjack';bjRender();await sleep(700);if(hv(BJ.dealer.map(c=>({...c,hidden:false}))).t===21){BJ.dealer[1].hidden=false;BJ.msg='Dealer has blackjack';bjRender();await sleep(500);return bjSettle()}}
 for(let i=0;i<5;i++){const s=BJ.seats[i];if(!s)continue;if(hv(s.cards).t===21)continue;BJ.turn=i;
  if(s.isMe){BJ.msg='Your turn. Hit, stand or double down.';bjRender();await new Promise(res=>BJ.resolver=res)}else{BJ.msg=`${s.name} is playing`;bjRender();await bjBot(s)}}
 BJ.turn=-1;BJ.dealer[1].hidden=false;BJ.msg='Dealer reveals';bjRender();await sleep(650);
 if(act.some(s=>hv(s.cards).t<=21)){while(hv(BJ.dealer).t<17){BJ.dealer.push(bjDrawFor(BJ.dealer,'dealer'));bjRender();await sleep(650)}}
 bjSettle()}
async function bjBot(s){const up=cvl(BJ.dealer[0]);await sleep(rnd(500,900));while(true){const{t,soft}=hv(s.cards);if(t>=21)break;if(s.cards.length===2&&(t===10||t===11)&&up<10&&Math.random()<.6){s.bet*=2;s.cards.push(bjDraw());bjRender();await sleep(500);break}const hit=soft?t<18:(t<12||(t<17&&up>=7));if(!hit)break;s.cards.push(bjDraw());bjRender();await sleep(rnd(500,800))}}
function bjHit(){if(BJ.turn!==2)return;const me=BJ.seats[2];me.cards.push(bjDrawFor(me.cards,'me'));bjRender();if(hv(me.cards).t>=21)setTimeout(bjEnd,350)}
function bjStand(){if(BJ.turn===2)bjEnd()}
function bjDouble(){const me=BJ.seats[2];if(BJ.turn!==2||me.cards.length!==2)return;if(!takeBet(me.bet,'blackjack',false))return;me.bet*=2;me.cards.push(bjDrawFor(me.cards,'me'));bjRender();setTimeout(bjEnd,450)}
function bjEnd(){const r=BJ.resolver;BJ.resolver=null;if(r)r()}
function bjSettle(){const d=hv(BJ.dealer).t,dbj=BJ.dealer.length===2&&d===21;let mine='';
 for(const s of BJ.seats){if(!s||!s.cards.length)continue;const t=hv(s.cards).t,pbj=s.cards.length===2&&t===21;let ret=0,res;
  if(t>21)res='Bust';else if(pbj&&!dbj){ret=s.bet*(s.isMe&&U().inv.velvet?3:2.5);res='Blackjack'}else if(dbj&&!pbj)res='Lose';else if(d>21||t>d){ret=s.bet*2;res='Win'}else if(t===d){ret=s.bet;res='Push'}else res='Lose';
  s.result=res;s.ret=ret;
  if(s.isMe){quest('bj_hand',1);if(res==='Push'){U().balance+=ret;mine=`Push. Your ${fmt(ret)} is returned.`;log('game','Blackjack push',0)}else if(ret>0){const p=pay(ret,'blackjack');quest('bj_win',1);mine=`${res==='Blackjack'?'Blackjack. ':''}You win ${fmt(p)}.`;toast(`Blackjack: you collect ${fmt(p)}`,'win');log('game',`Blackjack ${res.toLowerCase()} with ${t}`,p-s.bet)}else{mine=res==='Bust'?`Bust with ${t}. You lose ${fmt(s.bet)}.`:`Dealer wins with ${d}. You lose ${fmt(s.bet)}.`;log('game',`Blackjack lost with ${t>21?'bust':t}`,-s.bet)}save()}}
 BJ.msg=mine||'Hand complete.';BJ.phase='bet';bjRender()}

function loadPeer(){if(window.Peer)return Promise.resolve();if(PEER_P)return PEER_P;PEER_P=new Promise((res,rej)=>{const urls=['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js','https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'];let i=0;const next=()=>{if(i>=urls.length)return rej(new Error('load'));const s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.Peer?res():next();s.onerror=()=>{s.remove();next()};document.head.appendChild(s)};next()});PEER_P.catch(()=>{PEER_P=null});return PEER_P}
const Net={
 async host(code,h){
  if(NET_LOCAL){const ch=new BroadcastChannel('vm-'+code);ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;if(m.k==='ping')return ch.postMessage({to:m.from,from:'host',k:'pong'});if(m.k==='hello')h.conn(m.from);if(m.k==='msg')h.data(m.from,m.d);if(m.k==='bye')h.close(m.from)};setTimeout(h.ready,20);return{send:(id,d)=>ch.postMessage({to:id,from:'host',k:'msg',d}),close:()=>{ch.postMessage({to:'*',from:'host',k:'bye'});ch.close()}}}
  await loadPeer();
  const peer=new Peer(PFX+code,{debug:0}),conns=new Map();
  peer.on('open',()=>h.ready());
  peer.on('error',e=>h.error(e));
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',c=>{c.on('open',()=>{conns.set(c.peer,c);h.conn(c.peer)});c.on('data',d=>h.data(c.peer,d));c.on('close',()=>{conns.delete(c.peer);h.close(c.peer)});c.on('error',()=>{})});
  return{send:(id,d)=>{const c=conns.get(id);if(c&&c.open)c.send(d)},close:()=>{try{peer.destroy()}catch(e){}}}
 },
 async join(code,h){
  let done=false;const fail=m=>{if(done)return;done=true;h.error(m)};
  if(NET_LOCAL){const me='c'+Math.random().toString(36).slice(2,9);const ch=new BroadcastChannel('vm-'+code);ch.onmessage=e=>{const m=e.data;if(m.to!==me&&m.to!=='*')return;if(m.k==='pong'&&!done){done=true;ch.postMessage({to:'host',from:me,k:'hello'});h.open(me)}if(m.k==='msg')h.data(m.d);if(m.k==='bye')h.close()};ch.postMessage({to:'host',from:me,k:'ping'});setTimeout(()=>{if(!done){ch.close();fail('Table not found. Check the code.')}},2500);return{send:d=>ch.postMessage({to:'host',from:me,k:'msg',d}),close:()=>{ch.postMessage({to:'host',from:me,k:'bye'});ch.close()}}}
  await loadPeer();
  const peer=new Peer({debug:0});let conn=null;
  peer.on('error',e=>{if(!done){fail(e.type==='peer-unavailable'?'Table not found. Check the code or ask the host to reopen it.':'Connection failed ('+e.type+')');try{peer.destroy()}catch(x){}}});
  peer.on('open',id=>{conn=peer.connect(PFX+code,{reliable:true});conn.on('open',()=>{if(done)return;done=true;h.open(id)});conn.on('data',d=>h.data(d));conn.on('close',()=>h.close())});
  setTimeout(()=>{if(!done){fail('Could not reach the table. The host may be offline.');try{peer.destroy()}catch(e){}}},15000);
  return{send:d=>{if(conn&&conn.open)conn.send(d)},close:()=>{try{conn&&conn.close()}catch(e){}try{peer.destroy()}catch(e){}}}
 }
};

/* host engine */
function hDraw(){if(MP.shoe.length<52){MP.shoe=newShoe();hostSys('The dealer shuffles a fresh six deck shoe')}return MP.shoe.pop()}
function hTake(pred){const i=MP.shoe.findIndex(pred);return i<0?null:MP.shoe.splice(i,1)[0]}
function hDrawFor(cards,vip){if(vip){const{t,soft}=hv(cards);if(!soft&&t>=10&&t<=16){if(Math.random()<(t>=12?.72:.35)){const c=hTake(c=>cvl(c)===21-t);if(c)return c}if(t>=12&&Math.random()<.6){const c=hTake(c=>c.r!=='A'&&cvl(c)<=21-t);if(c)return c}}}return hDraw()}
function hDrawDealer(vip){if(vip){const{t,soft}=hv(MP.S.dealer);if(!soft&&t>=12&&t<=16&&Math.random()<.3){const c=hTake(c=>c.r!=='A'&&cvl(c)>21-t);if(c)return c}}return hDraw()}
function hostSys(m){if(!MP||!MP.S)return;MP.S.chat.push({sys:1,m,t:Date.now()});if(MP.S.chat.length>40)MP.S.chat.shift()}
function hostSend(id,msg){if(!MP)return;if(id==='host')clientHandle(msg);else MP.net&&MP.net.send(id,msg)}
function mpSanitize(S){const v=JSON.parse(JSON.stringify(S));v.dealer=v.dealer.map(c=>c.hidden?{hidden:true,r:'?',s:'♠'}:c);for(const k in v.players)delete v.players[k].vip;return v}
function mpBroadcast(){if(!MP||MP.role!=='host')return;const v=mpSanitize(MP.S);for(const id in MP.S.players){const p=MP.S.players[id];if(id!=='host'&&p.online!==false)MP.net.send(id,{t:'state',s:v})}mpOnState(v)}
function mpOnState(v){const prev=MP.V;MP.V=v;if(prev&&v.chat.length&&CUR!=='blackjack'){const last=v.chat[v.chat.length-1];const pl=prev.chat[prev.chat.length-1];if(last&&(!pl||last.t!==pl.t)&&!last.sys&&last.id!==MP.myId)toast(`${esc(last.n)} at your table: ${esc(last.m)}`,'gold')}if(CUR==='blackjack'&&!$('#mpTable'))mpView();else mpRender()}
async function mpCreate(name,minBet){if(MP)return;const code=genCode();
 MP={role:'host',code,myId:'host',connecting:true,shoe:newShoe(),S:{name:String(name||'Private table').slice(0,28),minBet,phase:'betting',t:BET_T,turn:-1,turnT:0,players:{},seats:[null,null,null,null,null],dealer:[],msg:'Take a seat to start',chat:[],round:0},V:null};

  conn:()=>{},

 catch(e){mpCleanup(true);toast('Could not load the multiplayer service. Check your internet connection.','err')}}
function hostJoin(id,q){const S=MP.S;q=q||{};S.players[id]={id,name:String(q.name||'Guest').slice(0,18),avatar:esc(String(q.avatar||'🙂').slice(0,4)),color:/^#[0-9a-f]{6}$/i.test(q.color)?q.color:'#2a2f3d',frame:['none','gold','emerald','neon','diamond'].includes(q.frame)?q.frame:'none',title:String(q.title||'').slice(0,20),vip:!!q.vip,seat:-1,bet:0,cards:[],res:'',done:false,online:true}}
function hostHandle(id,d){if(!MP||MP.role!=='host'||!d)return;const S=MP.S;const p=S.players[id];
 if(d.t==='hello'){if(Object.keys(S.players).length>=12)return hostSend(id,{t:'full'});if(!p){hostJoin(id,d.p);hostSys(`${S.players[id].name} joined the table`)}return mpBroadcast()}
 if(!p)return;
 switch(d.t){
  case'sit':{const s=+d.seat;if(p.seat>=0||!(s>=0&&s<SEATS)||S.seats[s])return;S.seats[s]=id;p.seat=s;hostSys(`${p.name} sat down at seat ${s+1}`);break}
  case'standup':{if(p.seat<0||p.bet)return;S.seats[p.seat]=null;p.seat=-1;p.cards=[];p.res='';break}
  case'bet':{const a=Math.floor(+d.amt)||0;if(S.phase!=='betting'||p.seat<0||p.bet||a<S.minBet||a>1e9){if(a>0)hostSend(id,{t:'refund',amt:a,reason:'the bet was not accepted'});return}p.bet=a;p.cards=[];p.res='';const seated=S.seats.filter(Boolean).map(x=>S.players[x]);if(seated.every(x=>x.bet>0))S.t=Math.min(S.t,3);break}
  case'dealnow':{if(id==='host'&&S.phase==='betting'&&S.seats.some(x=>x&&S.players[x].bet>0))S.t=Math.min(S.t,1);break}
  case'act':{if(S.phase!=='playing'||S.seats[S.turn]!==id||p.done){if(d.a==='double'&&d.amt>0)hostSend(id,{t:'refund',amt:+d.amt,reason:'it was not your turn'});return}hostAct(id,p,d);return}
  case'chat':{const m=String(d.m||'').trim().slice(0,200);if(!m)return;S.chat.push({n:p.name,m,t:Date.now(),id});if(S.chat.length>40)S.chat.shift();break}
  case'kick':{if(id!=='host'||!d.who||d.who==='host'||!S.players[d.who])return;const q=S.players[d.who];hostSend(d.who,{t:'kicked'});hostSys(`${q.name} was removed by the host`);hostDrop(d.who,true);return}
  case'leave':hostDrop(id);return;
  default:return}
 mpBroadcast()}
function hostDrop(id,quiet){if(!MP||MP.role!=='host')return;const S=MP.S,p=S.players[id];if(!p)return;if(!quiet)hostSys(`${p.name} left the table`);
 const inHand=p.bet>0&&p.cards.length&&S.phase!=='betting'&&S.phase!=='settle';

 else{if(p.seat>=0)S.seats[p.seat]=null;delete S.players[id]}
 mpBroadcast()}
function hostTick(){if(!MP||MP.role!=='host')return;const S=MP.S;
 if(S.phase==='betting'){const seated=S.seats.filter(Boolean);if(!seated.length){S.t=BET_T;S.msg='Take a seat to start the next hand'}else{S.t--;const n=seated.filter(id=>S.players[id].bet>0).length;S.msg=n?`${n} of ${seated.length} bets in · dealing in ${Math.max(0,S.t)}s`:`Place your bets · ${Math.max(0,S.t)}s`;if(S.t<=0){if(n)return hostDeal();S.t=BET_T}}mpBroadcast()}

async function hostDeal(){const S=MP.S;S.phase='dealing';S.round++;S.dealer=[];S.turn=-1;
 const inHand=[];S.seats.forEach((id,i)=>{if(!id)return;const p=S.players[id];p.cards=[];p.res='';p.done=false;p.doubled=false;if(p.bet>0)inHand.push(i)});
 S.msg='Dealing';mpBroadcast();
 for(let r=0;r<2;r++){for(const i of inHand){const p=S.players[S.seats[i]];if(p)p.cards.push(hDraw());mpBroadcast();await sleep(320);if(!MP)return}const dc=hDraw();if(r===1)dc.hidden=true;S.dealer.push(dc);mpBroadcast();await sleep(320);if(!MP)return}

 inHand.forEach(i=>{const p=S.players[S.seats[i]];if(p&&hv(p.cards).t===21)p.done=true});
 S.phase='playing';hostNext()}
function hostNext(){if(!MP)return;const S=MP.S;if(S.phase!=='playing')return;let i=S.turn+1;
 for(;i<SEATS;i++){const id=S.seats[i];if(!id)continue;const p=S.players[id];if(p.bet>0&&p.cards.length&&!p.done)break}

function hostAct(id,p,d){const S=MP.S;
 if(d.a==='hit'){p.cards.push(hDrawFor(p.cards,p.vip));if(hv(p.cards).t>=21){p.done=true;mpBroadcast();setTimeout(hostNext,550)}else{S.turnT=TURN_T;mpBroadcast()}}
 else if(d.a==='stand'){p.done=true;hostNext()}

async function hostDealer(){const S=MP.S;S.phase='dealer';if(S.dealer[1])S.dealer[1].hidden=false;S.msg='Dealer reveals';mpBroadcast();await sleep(750);if(!MP)return;
 const hands=S.seats.filter(Boolean).map(id=>S.players[id]).filter(p=>p.bet>0&&p.cards.length);
 const vip=hands.some(p=>p.vip);
 if(hands.some(p=>hv(p.cards).t<=21))while(hv(S.dealer).t<17){S.dealer.push(hDrawDealer(vip));mpBroadcast();await sleep(750);if(!MP)return}
 hostSettle()}
function hostSettle(){const S=MP.S;S.dealer.forEach(c=>c.hidden=false);const d=hv(S.dealer).t,dbj=S.dealer.length===2&&d===21;
 for(const id of S.seats){if(!id)continue;const p=S.players[id];if(!p.bet||!p.cards.length)continue;const t=hv(p.cards).t,pbj=p.cards.length===2&&t===21;let ret=0,res;
  if(t>21)res='Bust';else if(pbj&&!dbj){ret=p.bet*2.5;res='Blackjack'}else if(dbj&&!pbj)res='Lose';else if(d>21||t>d){ret=p.bet*2;res='Win'}else if(t===d){ret=p.bet;res='Push'}else res='Lose';
  p.res=res;p.ret=ret;if(p.online!==false)hostSend(id,{t:'result',bet:p.bet,ret,res,total:t,dealer:d,round:S.round})}
 S.phase='settle';S.msg=d>21?`Dealer busts with ${d}`:`Dealer stands on ${d}`;hostSys(S.msg);mpBroadcast();
 setTimeout(()=>{if(!MP)return;for(const id in S.players){const p=S.players[id];if(p.online===false){if(p.seat>=0)S.seats[p.seat]=null;delete S.players[id];continue}p.bet=0;p.done=false;p.doubled=false;p.cards=[];p.res=''}S.dealer=[];S.phase='betting';S.t=BET_T;S.turn=-1;mpBroadcast()},5500)}

function clientHandle(d){if(!MP||!d)return;
 if(d.t==='state'){if(MP.role==='client')mpOnState(d.s);return}
 if(d.t==='result'){MP.settled=d.round;applyResult(d);return}
 if(d.t==='refund'){refund(d.amt);toast(`${fmt(d.amt)} returned because ${esc(d.reason)}`,'info');return}
 if(d.t==='kicked'){mpRefundOpen();MP.leaving=true;toast('The host removed you from the table','err');mpCleanup();return}
 if(d.t==='closed'){mpRefundOpen();MP.leaving=true;toast('The host closed the table','info');mpCleanup();return}
 if(d.t==='full'){MP.leaving=true;toast('This table is full','err');mpCleanup()}}
function applyResult(r){const u=U();quest('bj_hand',1);let ret=r.ret;if(r.res==='Blackjack'&&u.inv.velvet)ret=r.bet*3;
 if(r.res==='Push'){u.balance+=ret;log('game','Blackjack table push',0);toast(`Push. Your ${fmt(ret)} is returned`,'info')}
 else if(ret>0){const p=pay(ret,'blackjack');quest('bj_win',1);log('game',`Blackjack table ${r.res.toLowerCase()} with ${r.total}`,p-r.bet);toast(`${r.res==='Blackjack'?'Blackjack! ':''}You win ${fmt(p)}`,'win')}
 else{log('game',`Blackjack table ${r.res==='Bust'?'bust':'lost with '+r.total}`,-r.bet);toast(r.res==='Bust'?`Bust. You lose ${fmt(r.bet)}`:`Dealer wins. You lose ${fmt(r.bet)}`,'lose')}
 save()}

const LOANS=[{amt:10000,rate:.08,lvl:1},{amt:50000,rate:.12,lvl:2},{amt:100000,rate:.15,lvl:4},{amt:250000,rate:.20,lvl:6}];
const DAY=86400000;
function credit(){const u=U();return Math.max(300,Math.min(850,620+u.repaid*25-u.lateCount*45))}
function checkLoans(){if(!ME)return;const u=U();let ch=false;for(const l of u.loans){if(!l.late&&Date.now()>l.due){l.late=true;l.owe=Math.ceil(l.owe*1.1);u.lateCount++;ch=true;inbox('Loan overdue',`Your loan of ${fmt(l.amt)} passed its due date. A 10% late fee was added. You now owe ${fmt(l.owe)}.`,'Velmont Bank');toast('A loan is overdue. A late fee was added.','err')}}if(ch)save()}

 <div class="shop-grid">${LOANS.map(o=>{const lock=lv<o.lvl,full=u.loans.length>=2;return`<div class="item"><div class="ic">🏦</div><h4>${fmt(o.amt)}</h4><p>${Math.round(o.rate*100)}% fee. You repay ${fmt(o.amt*(1+o.rate))} within 24 hours.${lock?` Unlocks at level ${o.lvl}.`:''}</p><div class="pr"><span class="tag ${lock?'red':'green'}">${lock?'Level '+o.lvl:'Available'}</span><button class="btn btn-gold btn-sm" data-loan="${o.amt}" ${lock||full?'disabled':''}>Borrow</button></div></div>`}).join('')}</div>
 <h2 class="sec">Active loans</h2>
 <div class="card">${u.loans.length?`<div class="tbl-wrap"><table class="tbl"><tr><th>Borrowed</th><th>Owed</th><th>Due</th><th>Status</th><th></th></tr>${u.loans.map(l=>`<tr><td>${fmt(l.amt)}</td><td><b>${fmt(l.owe)}</b></td><td>${stamp(l.due)}</td><td>${l.late?'<span class="tag red">Overdue</span>':'<span class="tag green">On time</span>'}</td><td style="text-align:right"><div class="row" style="justify-content:flex-end"><input type="number" style="width:120px;padding:8px" id="rp${l.id}" value="${Math.min(l.owe,Math.floor(u.balance))}"><button class="btn btn-sm btn-gold" data-repay="${l.id}">Repay</button></div></td></tr>`).join('')}</table></div>`:'<p class="empty">No active loans</p>'}</div>`;

 $('#actX').onclick=()=>{const csv='time,type,event,amount\n'+u.log.map(l=>[new Date(l.t).toISOString(),l.type,'"'+String(l.msg).replace(/"/g,'""')+'"',l.amt??''].join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='velmont-activity.csv';a.click()}};
